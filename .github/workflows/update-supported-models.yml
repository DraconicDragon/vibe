name: Update Supported Models

on:
  push:
    paths:
      - "scripts/**"
      - "vibe/**"
      - "SUPPORTED_MODELS.md"
      - ".github/workflows/update-supported-models.yml"
  workflow_dispatch:

jobs:
  generate-supported-models:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Regenerate supported models document
        run: python scripts/generate_supported_models.py

      - name: Verify document is up to date
        run: git diff --exit-code -- SUPPORTED_MODELS.md
